<title>Archives Orokin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&family=Michroma&family=Saira+Semi+Condensed:wght@300;400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout : console du Vitruvien — fond Néant absolu, panneaux holographiques ouverts et biseautés, lueur dorée, glyphes orokin vivants en arrière-plan */
:root{
  --void:#000;
  --deep:#07060a;
  --fill:rgba(18,15,9,.78);
  --edge:#5c4a1e;
  --gold:#f0bd4f;
  --gold-hi:#ffe9b0;
  --ink:#ece5d3;
  --mute:#9b917a;
  --bloom:0 0 4px rgba(255,214,120,.75),0 0 14px rgba(245,184,60,.45),0 0 36px rgba(230,160,40,.22);
  --bloom-sm:0 0 3px rgba(255,214,120,.6),0 0 10px rgba(245,184,60,.3);
  --f-display:"Aboreto","Federo","Didot",serif;
  --f-ui:"Michroma","Saira Semi Condensed",system-ui,sans-serif;
  --f-body:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;min-height:100%;position:relative;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:0 64px}
a{color:var(--gold-hi)}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:3px}

/* ---------- primitives : biseau, parallélogramme, cadre holo ---------- */
.bv{--c:12px;--e:var(--edge);--f:var(--fill);position:relative;isolation:isolate;background:var(--e);border:none;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.bv::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--f);
  clip-path:polygon(calc(var(--c) - .4px) 0,100% 0,100% calc(100% - var(--c) + .4px),calc(100% - var(--c) + .4px) 100%,0 100%,0 calc(var(--c) - .4px))}
.pg{--s:9px;--e:var(--edge);--f:rgba(10,8,4,.6);position:relative;isolation:isolate;background:var(--e);border:none;
  clip-path:polygon(var(--s) 0,100% 0,calc(100% - var(--s)) 100%,0 100%)}
.pg::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--f);
  clip-path:polygon(var(--s) 0,100% 0,calc(100% - var(--s)) 100%,0 100%)}
.holo{--b:var(--gold);--k:16px;position:relative;
  background:
   linear-gradient(var(--b),var(--b)) top left/var(--k) 1px no-repeat,
   linear-gradient(var(--b),var(--b)) top left/1px var(--k) no-repeat,
   linear-gradient(var(--b),var(--b)) bottom right/var(--k) 1px no-repeat,
   linear-gradient(var(--b),var(--b)) bottom right/1px var(--k) no-repeat,
   linear-gradient(90deg,rgba(240,189,79,.35),transparent 40%) top left/100% 1px no-repeat,
   radial-gradient(120% 90% at 0 0,rgba(240,189,79,.07),transparent 60%),
   rgba(8,7,4,.55)}

/* ---------- en-tête ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(#000 65%,transparent);padding-block:14px 20px}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--gold-hi)}
.brand svg{flex:none;filter:drop-shadow(0 0 4px rgba(255,200,90,.8))}
.brand b{font-family:var(--f-display);font-weight:400;letter-spacing:.24em;font-size:15px;text-shadow:var(--bloom-sm)}
nav.rooms{display:flex;gap:2px;flex-wrap:wrap}
nav.rooms button{--s:11px;padding:7px 22px;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);cursor:pointer;transition:color .2s}
nav.rooms button:hover{--e:var(--gold);color:var(--gold-hi)}
nav.rooms button[aria-selected="true"]{--e:var(--gold-hi);--f:linear-gradient(180deg,rgba(240,189,79,.28),rgba(240,189,79,.06));color:var(--gold-hi);text-shadow:var(--bloom)}
.sound{--c:7px;display:flex;align-items:center;gap:8px;padding:6px 13px;font-family:var(--f-mono);font-size:12px;color:var(--mute);cursor:pointer;letter-spacing:.06em}
.sound[aria-pressed="true"]{--e:var(--gold);color:var(--gold-hi)}
.sound i{width:6px;height:6px;transform:rotate(45deg);background:var(--edge);display:inline-block}
.sound[aria-pressed="true"] i{background:var(--gold-hi);box-shadow:0 0 6px var(--gold),0 0 14px var(--gold)}

/* ---------- héros ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;padding-block:20px 34px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:22%;bottom:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(240,189,79,.2) 60%,transparent);box-shadow:var(--bloom-sm)}
.eyebrow{font-family:var(--f-ui);font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;text-shadow:var(--bloom-sm)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5.6vw,62px);line-height:1.08;margin:.35em 0 .1em;letter-spacing:.07em;text-wrap:balance;color:var(--gold-hi);text-shadow:var(--bloom)}
h1 em{font-style:normal;color:#fff6dc;letter-spacing:.14em}
.sweep{display:block;height:9px;margin:8px 0 2px;max-width:520px;overflow:visible}
.glyphs{display:block;height:17px;margin:6px 0 18px;color:var(--gold);overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 0,#000 70%,transparent)}
.glyphs svg{height:100%;width:auto;max-width:none;filter:drop-shadow(0 0 2px rgba(255,205,100,.9)) drop-shadow(0 0 6px rgba(240,170,50,.5))}
.glyphs .gl{opacity:.55;animation:flick 6s infinite steps(1)}
@keyframes flick{0%{opacity:.55}3%{opacity:1}5%{opacity:.25}8%{opacity:.55}}
.glyphs::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:0;transform:translateX(-60px);will-change:transform;background:linear-gradient(90deg,transparent,rgba(255,233,176,.55),transparent);mix-blend-mode:screen;animation:scan 5.5s linear infinite}
@keyframes scan{to{transform:translateX(560px)}}
.lede{max-width:56ch;color:var(--ink);font-weight:300;font-size:18px;margin:0}
.stats{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.stats div{--k:12px;padding:10px 18px 10px 16px;min-width:120px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--gold-hi);font-variant-numeric:tabular-nums;text-shadow:var(--bloom);letter-spacing:.06em}
.stats span{font-family:var(--f-ui);font-size:9px;color:var(--mute);letter-spacing:.24em;text-transform:uppercase}
.seal{width:100%;max-width:440px;aspect-ratio:1;justify-self:center;display:block}

/* ---------- sections ---------- */
section.room{padding-top:38px}
.room-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.2vw,32px);letter-spacing:.12em;margin:0;color:var(--gold-hi);text-wrap:balance;text-shadow:var(--bloom)}
.room-head p{margin:4px 0 0;color:var(--mute);max-width:60ch}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{--s:8px;color:var(--mute);padding:5px 16px;font-size:13px;cursor:pointer;letter-spacing:.04em}
.chip:hover{--e:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"]{--e:var(--gold-hi);--f:rgba(240,189,79,.16);color:var(--gold-hi);text-shadow:var(--bloom-sm)}

/* ---------- chronologie ---------- */
.tl-scroll{--c:18px;overflow-x:auto;scrollbar-color:var(--gold) #000;--f:linear-gradient(180deg,rgba(14,11,5,.85),rgba(4,3,1,.85))}
.tl{position:relative;min-width:1500px;height:214px}
.tl .eraband{position:absolute;top:0;bottom:0;padding:12px 14px;background:linear-gradient(180deg,transparent 20%,rgba(240,189,79,.25) 50%,transparent 80%) right/1px 100% no-repeat}
.tl .eraband span{font-family:var(--f-ui);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-shadow:var(--bloom-sm)}
.tl .eraband small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.tl .axis{position:absolute;left:0;right:0;top:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 3%,var(--gold-hi) 50%,var(--gold) 97%,transparent);box-shadow:0 0 6px rgba(255,200,90,.8),0 0 18px rgba(240,170,50,.4)}
.tl .axis::after{content:"";position:absolute;top:-1px;height:3px;width:120px;left:0;transform:translateX(-120px);will-change:transform;background:linear-gradient(90deg,transparent,#fff3cf,transparent);filter:blur(1px);animation:pulse 7s linear infinite}
@keyframes pulse{to{transform:translateX(var(--tlw,1800px))}}
.node{position:absolute;top:106px;width:28px;height:28px;margin-left:-14px;background:none;border:none;cursor:pointer;padding:0}
.node::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);transform:rotate(45deg);background:#000;transition:all .2s;box-shadow:0 0 6px rgba(240,189,79,.6)}
.node:hover::before{background:var(--gold);box-shadow:0 0 10px var(--gold),0 0 22px rgba(240,170,50,.6)}
.node[aria-current="true"]::before{background:var(--gold-hi);inset:5px;box-shadow:0 0 10px #fff0c4,0 0 26px var(--gold),0 0 50px rgba(240,170,50,.5)}
.node .lbl{position:absolute;left:50%;width:124px;margin-left:-62px;font-size:12px;line-height:1.25;color:var(--mute);text-align:center;pointer-events:none}
.node.up .lbl{bottom:34px}.node.dn .lbl{top:34px}
.node[aria-current="true"] .lbl,.node:hover .lbl{color:var(--gold-hi);text-shadow:var(--bloom-sm)}
.node .lbl::after{content:"";position:absolute;left:50%;width:1px;background:linear-gradient(var(--gold),transparent)}
.node.up .lbl::after{top:100%;height:7px;background:linear-gradient(transparent,var(--gold))}.node.dn .lbl::after{bottom:100%;height:7px}

.detail{--k:22px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;margin-top:14px}
.detail .main{padding:26px 30px;min-width:0}
.detail aside{padding:26px 24px;min-width:0;background:linear-gradient(180deg,transparent,rgba(240,189,79,.35),transparent) left/1px 100% no-repeat}
.detail h3{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:400;margin:6px 0 0;color:var(--gold-hi);letter-spacing:.08em;text-wrap:balance;text-shadow:var(--bloom)}
.detail .when{font-family:var(--f-ui);font-size:9.5px;color:var(--gold);letter-spacing:.24em;text-transform:uppercase}
.detail p{max-width:65ch}
.detail .sum{font-size:18px;font-weight:300}
.lab{font-family:var(--f-ui);font-size:9px;color:var(--mute);letter-spacing:.26em;text-transform:uppercase;margin:0 0 9px}
.srcs{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:7px}
.srcs li{display:flex;gap:9px;font-size:14px}
.srcs li b{font-family:var(--f-mono);font-weight:400;font-size:11px;color:#140f04;background:var(--gold);padding:1px 9px;height:fit-content;white-space:nowrap;letter-spacing:.06em;box-shadow:0 0 8px rgba(240,189,79,.5);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.links{display:flex;flex-wrap:wrap;gap:4px}
.link{--s:7px;color:var(--ink);padding:4px 14px;font-size:13px;cursor:pointer}
.link:hover{--e:var(--gold);color:var(--gold-hi);text-shadow:var(--bloom-sm)}
.stepper{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.stepper button{--s:9px;color:var(--mute);padding:7px 18px;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.stepper button:hover:not(:disabled){--e:var(--gold);color:var(--gold-hi)}
.stepper button:disabled{opacity:.3;cursor:default}

/* ---------- archives ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search-w{--c:9px;flex:1 1 240px;min-width:0;display:flex}
.search{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);padding:9px 14px;font-family:var(--f-mono);font-size:14px}
.search:focus{outline:none}
.search-w:focus-within{--e:var(--gold-hi)}
.search::placeholder{color:var(--mute)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.file{--c:18px;text-align:left;padding:18px 20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:--e .2s}
.file::after{content:"";position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,transparent 0 49%,var(--gold) 49% 52%,transparent 52%);opacity:.9}
.file:hover{--e:var(--gold);--f:linear-gradient(160deg,rgba(240,189,79,.12),rgba(14,11,5,.85) 50%)}
.file .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-ui);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.file h4{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;letter-spacing:.07em;color:var(--ink)}
.file:hover h4{color:var(--gold-hi);text-shadow:var(--bloom-sm)}
.file p{margin:0;color:var(--mute);font-size:14px}
.file .lvl{display:flex;gap:3px;margin-top:auto;align-items:center}
.file .lvl i{width:14px;height:3px;background:var(--edge);transform:skewX(-35deg)}
.file .lvl i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.file .lvl span{margin-left:8px;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.file.read h4::after{content:" ◇";color:var(--gold);font-size:13px}
.empty{color:var(--mute);font-family:var(--f-mono);padding:30px 0}

/* ---------- index ---------- */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ent{--c:14px;padding:16px;text-align:left;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.ent:hover{--e:var(--gold);--f:linear-gradient(160deg,rgba(240,189,79,.12),rgba(14,11,5,.85) 50%)}
.ent .sig{width:44px;height:44px;color:var(--gold);filter:drop-shadow(0 0 3px rgba(255,200,90,.8))}
.ent h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:400;color:var(--ink);letter-spacing:.07em}
.ent:hover h4{color:var(--gold-hi);text-shadow:var(--bloom-sm)}
.ent small{display:block;color:var(--gold);font-family:var(--f-ui);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;margin:4px 0 5px}
.ent p{margin:0;font-size:13px;color:var(--mute);line-height:1.45}

/* ---------- dossier ---------- */
.veil{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,rgba(30,22,6,.9),rgba(0,0,0,.95));display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 40px;overflow-y:auto}
.dossier{--c:28px;--e:linear-gradient(135deg,var(--gold-hi),var(--edge) 40%,var(--edge) 60%,var(--gold));--f:linear-gradient(170deg,rgba(26,20,8,.97),rgba(4,3,1,.98) 45%);width:100%;max-width:760px;padding:34px clamp(18px,4vw,44px) 32px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.dossier .x{--s:8px;position:absolute;top:14px;right:16px;color:var(--mute);padding:5px 14px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.dossier .x:hover{--e:var(--gold);color:var(--gold-hi)}
.dossier h3{font-family:var(--f-display);font-size:clamp(22px,4vw,32px);font-weight:400;margin:8px 0 0;color:var(--gold-hi);letter-spacing:.08em;padding-right:70px;text-wrap:balance;text-shadow:var(--bloom)}
.dossier .body p{max-width:65ch}
.dossier .stamp{display:inline-block;color:var(--gold);font-family:var(--f-ui);font-size:9px;padding:3px 14px;letter-spacing:.24em;text-transform:uppercase;background:rgba(240,189,79,.1);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);text-shadow:var(--bloom-sm)}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.kv div{--k:10px;padding:9px 14px;flex:1 1 150px}
.kv span{display:block;font-family:var(--f-ui);font-size:8.5px;color:var(--mute);letter-spacing:.22em;text-transform:uppercase}
.kv b{font-weight:500;font-size:14px}
.audio{--c:12px;padding:14px 18px;margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.audio .play{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle,rgba(240,189,79,.18),transparent 70%);color:var(--gold-hi);cursor:pointer;flex:none;display:grid;place-items:center;box-shadow:0 0 10px rgba(240,189,79,.5),inset 0 0 8px rgba(240,189,79,.3)}
.audio .play:disabled{opacity:.3;cursor:default;box-shadow:none}
.audio .txt{flex:1 1 200px;min-width:0;font-size:13px;color:var(--mute)}
.audio .txt b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.audio label{color:var(--mute);padding:6px 16px;font-family:var(--f-mono);font-size:11px;cursor:pointer;letter-spacing:.08em;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);background:rgba(240,189,79,.1)}
.audio label:hover{color:var(--gold-hi);background:rgba(240,189,79,.2)}
.audio input{position:absolute;opacity:0;width:1px;height:1px}
.wave{display:flex;gap:2px;height:22px;align-items:center}
.wave i{width:2px;background:var(--gold);height:20%;transition:height .1s;box-shadow:0 0 4px var(--gold)}

footer{margin-top:56px;padding-top:18px;position:relative;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer::before{content:"";position:absolute;top:0;left:30%;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold));box-shadow:var(--bloom-sm)}
footer p{margin:0;max-width:70ch}
footer .glyphs{width:220px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .seal{max-width:300px;grid-row:1;margin-bottom:-20px}
  .detail{grid-template-columns:1fr}
  .detail aside{background:linear-gradient(90deg,transparent,rgba(240,189,79,.35),transparent) top/100% 1px no-repeat}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
